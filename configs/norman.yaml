# Norman K562 — multi-gene perturbation dataset (2-gene combinatorial)
# Uses signature scoring for pairwise gene identification

exp_name: river_norman
seed: 42
device: cuda

data:
  dataset: Norman
  celltype: K562
  data_dir: rawdata
  processed_dir: processed_data

stage1:
  n_epochs: 500
  lr: 0.003
  hidden_dim: 64
  adj_threshold: 0.3
  lambda_l1: 0.002
  lambda_l1_no_prior: 0.02
  prior_mask_mode: adaptive

stage2:
  n_epochs: 300
  lr: 0.001
  batch_size: 256
  lambda_pert_scm: 0.1

stage3:
  max_interventions: 5
  diff_threshold: 0.5
  score_mode: signature
